<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivacyOS | Secure Vault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0a0a0f; color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #12121a; border-right: 1px solid #2d2d3a; }
        .nav-link { color: #a0a0b0; margin-bottom: 5px; border-radius: 5px; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { background-color: #0d6efd; color: white; }
    </style>
</head>
<body>
    <div class="d-flex">
        
        <!-- Sidebar Navigation -->
        <div class="sidebar p-3" style="width: 260px;">
            <h4 class="text-primary fw-bold mb-4 ms-2"><i class="bi bi-shield-lock-fill"></i> PrivacyOS</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a href="protect.html" class="nav-link"><i class="bi bi-shield-plus me-2"></i> Protect Data</a></li>
                <li class="nav-item"><a href="vault.html" class="nav-link active"><i class="bi bi-folder-fill me-2"></i> My Files</a></li>
                <li class="nav-item mt-4"><a href="index.html" class="nav-link text-danger"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
            </ul>
        </div>

        <!-- Main Content Area -->
        <div class="flex-grow-1 p-5 overflow-auto" style="max-height: 100vh;">
            <h2 class="fw-bold mb-4">My Secure Vault</h2>
            <p class="text-secondary mb-4">View and decrypt files shared with you.</p>

            <div class="card bg-dark border-secondary">
                <div class="card-body p-0">
                    <table class="table table-dark table-hover align-middle mb-0" id="vault-table">
                        <thead class="table-active">
                            <tr>
                                <th class="ps-4">File Name</th>
                                <th>Transfer Mode</th>
                                <th>Security Level</th>
                                <th class="text-end pe-4">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="4" class="text-center py-4 text-secondary">Loading files...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Decryption Modal -->
    <div class="modal fade" id="decryptModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-primary fw-bold"><i class="bi bi-unlock-fill"></i> Decrypt File</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <p class="text-secondary mb-4">The system will automatically retrieve your secure key and extract the file.</p>
                    <input type="hidden" id="target-file-id">
                    <button class="btn btn-success w-100 fw-bold py-2" onclick="decryptAndDownload()" id="decrypt-btn">
                        <i class="bi bi-fingerprint"></i> Authorize & Decrypt
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (Required for the Modal to pop up) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const API_URL = 'http://127.0.0.1:8000/api';
        
        // 1. Fetch files when the page loads
        window.onload = async () => {
            try {
                const response = await fetch(`${API_URL}/vault`);
                const files = await response.json();
                
                const tbody = document.querySelector('#vault-table tbody');
                tbody.innerHTML = '';
                
                if (files.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-secondary">No files in your vault.</td></tr>';
                    return;
                }

                files.forEach(file => {
                    const icon = file.transfer_mode === 'hidden' ? '<i class="bi bi-image" style="color: #cda4ff;"></i> Hidden' : '<i class="bi bi-file-earmark-lock text-success"></i> Direct';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-4 fw-bold">${file.file_name}</td>
                            <td>${icon}</td>
                            <td><span class="badge bg-secondary">${file.security_level.toUpperCase()}</span></td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-primary" onclick="openDecryptModal('${file.id}')">
                                    <i class="bi bi-key-fill"></i> Unlock
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error fetching files:", error);
            }
        };

        // 2. Open the Modal
        function openDecryptModal(fileId) {
            document.getElementById('target-file-id').value = fileId;
            new bootstrap.Modal(document.getElementById('decryptModal')).show();
        }

        // 3. Invisible Extraction & Download
        async function decryptAndDownload() {
            const fileId = document.getElementById('target-file-id').value;
            const btn = document.getElementById('decrypt-btn');

            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Extracting...`;
            btn.disabled = true;

            try {
                // The backend handles the key automatically now!
                const response = await fetch(`${API_URL}/extract/${fileId}`, { method: 'POST' });

                if (response.ok) {
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    
                    const disposition = response.headers.get('Content-Disposition');
                    let filename = "decrypted_file";
                    if (disposition && disposition.indexOf('filename=') !== -1) {
                        filename = disposition.split('filename=')[1].replace(/"/g, '');
                    }
                    
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    
                    alert("Magic! File extracted and downloaded automatically.");
                    bootstrap.Modal.getInstance(document.getElementById('decryptModal')).hide();
                } else {
                    const data = await response.json();
                    alert("Error: " + data.detail);
                }
            } catch (error) {
                alert("Network error.");
            } finally {
                btn.innerHTML = `<i class="bi bi-fingerprint"></i> Authorize & Decrypt`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
