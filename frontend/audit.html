<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivacyOS | Audit Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0a0a0f; color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #12121a; border-right: 1px solid #2d2d3a; }
        .nav-link { color: #a0a0b0; margin-bottom: 5px; border-radius: 5px; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { background-color: #0d6efd; color: white; }
    </style>
</head>
<body>
    <div class="d-flex">
        
        <!-- Sidebar Navigation -->
        <div class="sidebar p-3" style="width: 260px;">
            <h4 class="text-primary fw-bold mb-4 ms-2"><i class="bi bi-shield-lock-fill"></i> PrivacyOS</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a href="protect.html" class="nav-link"><i class="bi bi-shield-plus me-2"></i> Protect Data</a></li>
                <li class="nav-item"><a href="vault.html" class="nav-link"><i class="bi bi-folder-fill me-2"></i> My Files</a></li>
                <li class="nav-item"><a href="audit.html" class="nav-link active"><i class="bi bi-journal-text me-2"></i> Audit Logs</a></li>
                <li class="nav-item mt-4"><a href="index.html" class="nav-link text-danger"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
            </ul>
        </div>

        <!-- Main Content Area -->
        <div class="flex-grow-1 p-5 overflow-auto" style="max-height: 100vh;">
            <h2 class="fw-bold mb-4">Security Audit Logs</h2>
            <p class="text-secondary mb-4">Immutable record of all cryptographic operations and access attempts.</p>

            <div class="card bg-dark border-secondary shadow-lg">
                <div class="card-body p-0">
                    <table class="table table-dark table-hover mb-0" id="audit-table">
                        <thead class="table-active">
                            <tr>
                                <th class="ps-4">Time</th>
                                <th>Event Type</th>
                                <th>Details</th>
                                <th>File ID</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="4" class="text-center py-4 text-secondary">Loading logs...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api';
        
        window.onload = async () => {
            try {
                const response = await fetch(`${API_URL}/audit`);
                const logs = await response.json();
                
                const tbody = document.querySelector('#audit-table tbody');
                tbody.innerHTML = '';
                
                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-secondary">No audit logs found.</td></tr>';
                    return;
                }

                logs.forEach(log => {
                    // Format the date nicely
                    const date = new Date(log.timestamp).toLocaleString();
                    
                    // Assign colors based on event severity
                    let badgeColor = "bg-secondary";
                    if (log.event_type.includes("SUCCESS") || log.event_type === "FILE_DECRYPTED") badgeColor = "bg-success";
                    if (log.event_type.includes("FAILED") || log.event_type === "ACCESS_DENIED") badgeColor = "bg-danger";
                    if (log.event_type === "REGISTRATION") badgeColor = "bg-primary";

                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-4 text-secondary small">${date}</td>
                            <td><span class="badge ${badgeColor}">${log.event_type}</span></td>
                            <td>${log.details}</td>
                            <td class="text-secondary small font-monospace">${log.file_id ? log.file_id.substring(0,8) + '...' : 'N/A'}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error fetching logs:", error);
                document.querySelector('#audit-table tbody').innerHTML = '<tr><td colspan="4" class="text-center py-4 text-danger">Error loading logs. Backend might be down.</td></tr>';
            }
        };
    </script>
</body>
</html>
